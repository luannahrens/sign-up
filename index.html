<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up for Nothing</title>
  </head>
  <body>
    <div class="container">
        <div class="splash_image">
            <div class="odin_logo">
                    <img class="logo" src="./assets/odin-lined.png" alt="Odin Logo">
                    <span class="logo-text">ODIN</span>
            </div>
            <div class="image_credit">Image Credit: https://unsplash.com/@tioma_st</div>
                                                                                                      
        </div>
            
    
        <div class="form_container">

          <h1>This isn’t a real online service. Sign up if you want, nothing happens. 
            <br><br>
            So... ready for nothing?
          </h1>

    
          
            <form action="#" method="post">
                <fieldset class="form_inputs">
                    <h2>Sing up here:</h2>
                    <div class="row">
                        <div class="column">
                            <p>
                                <label for="name">First Name:</label><br>
                                <input type="text" id="name" name="user_name" />
                            </p>
                             <p>
                                <label for="mail">Email:</label><br>
                                <input type="email" id="mail" name="user_email" />
                            </p>
                            <p>
                                <label for="msg">Password:</label><br>
                                <input type="password" name="user_password" />
                            </p>
                        </div>
                        <div class="column">
                            <p>
                                <label for="surname">Last Name:</label><br>
                                <input type="text" id="surname" name="user_surname" />
                            </p>
                           
                            <p>
                                <label for="phone">Phone number:</label><br>
                                <input type="tel" id="phone" name="user_phone" />
                            </p>
                            
                            <p>
                                <label for="msg">Confirm Password:</label><br>
                                <input type="confirm" name="user_confirm" />
                            </p>
                        </div>
                    </div>
                </fieldset>
                <p class="account">
                    <button type="submit">Create Account</button>
                </p>
                <p class="account">Already have an account? <a href="#">Login</a></p>
            </form>
        </div>
    </div>
  </body>
</html>
